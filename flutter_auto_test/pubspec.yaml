name: flutter_auto_test
description: 腾讯自动化测试工具 - 支持APP/小程序/网页的Flutter自动化测试Android应用

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # 权限与系统交互
  permission_handler: ^11.3.0
  android_intent_plus: ^5.0.0

  # 文件与数据
  file_picker: ^9.0.0
  csv: ^6.0.0
  path_provider: ^2.1.0
  shared_preferences: ^2.3.0

  # UI 与图表
  fl_chart: ^0.69.0
  flutter_local_notifications: ^17.0.0

  # 网络
  dio: ^5.7.0

  # 国际化
  flutter_localizations:
    sdk: flutter
  intl: any

cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
